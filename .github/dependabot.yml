# https://docs.github.com/en/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically/configuration-options-for-dependency-updates#package-ecosystem

version: 2
updates:
  # Enable updates for Github Actions
  - package-ecosystem: "github-actions"
    target-branch: "master"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every month
      interval: "monthly"
    cooldown:
      default-days: 7
  # Enable updates for Cargo
  - package-ecosystem: "cargo"
    target-branch: "master"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    # The crates/vendor-* manifests mirror upstream hyper/h2/hyper-util and are
    # (re)generated by scripts/vendor-*.sh — dependency bumps there must come
    # from a re-vendor, never from a dependabot PR. The root Cargo.toml (pyo3,
    # the h2/hyper audit pins, ...) stays managed.
    exclude-paths:
      - "crates/**"
