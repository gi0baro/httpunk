# Vendored hyper-util proxy matcher plus upstream's feature-gated client/proxy
# module wiring; only lib.rs is hand-written. scripts/vendor-hyper-util.sh lists
# every modification. This workspace member owns its crate root (no path rewrite)
# and is excluded from the main crate's fmt/clippy via `cargo fmt -p`.
# Edition and base64 default features mirror upstream (version: UPSTREAM_VERSION).
[package]
name = "vendor-hyper-util"
version = "0.0.0"
edition = "2024"
publish = false

[features]
# client-proxy exposes the matcher to src/proxy.rs. The other features are cfg
# names only and stay off: no legacy, pool or platform code/deps are vendored.
default = ["client-proxy"]
client-proxy = []
client-legacy = []
client-pool = []
client-proxy-system = []

[dependencies]
http = "1"
ipnet = "2.9"
percent-encoding = "2.3"
base64 = "0.23"
